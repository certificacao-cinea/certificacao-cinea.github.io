<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validar certificado ou declaração | CINEA</title>
<link rel="icon" type="image/png" sizes="96x96" href="https://www.gstatic.com/images/branding/product/2x/apps_script_48dp.png">
<link rel="icon" href="https://script.google.com/favicon.ico" sizes="any">
<!--
  Validador público do sistema de certificados do CINEA: abre o Painel direto na tela de validação.
  Esta página não guarda nem recebe dados. Um link com ?codigo=NED-2026-0001 já chega com o código preenchido.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f5f9; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .reserva { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
             font-family: 'Open Sans', Segoe UI, Arial, sans-serif; color: #5a6b7d; font-size: 14px; padding: 0 16px; }
  .reserva a { color: #0068b0; }
</style>
</head>
<body>
  <div class="reserva"><p>Abrindo o validador… Se não abrir, <a id="reserva" href="#">clique aqui</a>.</p></div>
  <iframe id="quadro" title="Validar certificado ou declaração"></iframe>
  <script>
    var PAINEL = 'https://script.google.com/macros/s/AKfycbz1L1UzrBdnEPU8T4SS7jbnbiTjE9lTWxvonjVDX3-Y5TtvuiGMNO-0IO-iMVQMzy7c/exec';
    var codigo = (new URLSearchParams(location.search).get('codigo') || '').replace(/[^A-Za-z0-9-]/g, '').slice(0, 40);
    var url = PAINEL + '?pagina=validar' + (codigo ? '&codigo=' + encodeURIComponent(codigo) : '');
    document.getElementById('quadro').src = url;
    document.getElementById('reserva').href = url;
  </script>
</body>
</html>
